# M2: position-independent executable. Absolute pointers in data become
# RELATIVE relocations; the file type is DYN with DF_1_PIE.
description = "position-independent executable with relative relocations"
compile = ["cc -O2 -fPIE -c main.c", "cc -O2 -fPIE -c table.c"]
driver = "cc"
link = "-pie -o out main.o table.o"
run = "./out"
expect.stdout = """
one: 1
two: 4
three: 9
pointer to main is non-null: yes
"""
expect.readelf = [
  "DYN (Position-Independent Executable file)",
  "INTERP",
  "(FLAGS_1)",
  "PIE",
  "!TEXTREL",
]
expect.readelf_arch.x86_64 = ["R_X86_64_RELATIVE"]
expect.readelf_arch.aarch64 = ["R_AARCH64_RELATIVE"]
determinism = true
