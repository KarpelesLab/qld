# M2: --emit-relocs (-q) keeps the input relocations in the output, as BOLT
# and the Linux kernel's relocs tool expect: one `.rela` section per output
# section, offsets as output addresses, section symbols for local targets.
# The executable must still run, and GC'd code must not leave relocations.
description = "--emit-relocs keeps input relocations in an executable"
compile = [
  "cc -O1 -g -ffunction-sections -fdata-sections -fPIE -c main.c",
  "cc -O1 -g -ffunction-sections -fdata-sections -fPIE -c helper.c",
]
driver = "cc"
link = "-o out main.o helper.o -Wl,--emit-relocs -Wl,--gc-sections"
run = "./out"
expect.stdout = "alpha 15\n"
expect.readelf = [
  "Relocation section '.rela.text'",
  "Relocation section '.rela.data.rel.ro'",
  "Relocation section '.rela.debug_info'",
  "SECTION LOCAL  DEFAULT",
  "helper_qld + 0",
  "!unused_qld",
]
expect.readelf_arch.x86_64 = ["R_X86_64_GOTTPOFF", "R_X86_64_64 "]
expect.readelf_arch.aarch64 = ["R_AARCH64_TLSIE_ADR_GOTTPREL_PAGE21", "R_AARCH64_ABS64 "]
determinism = true
# GNU ld 2.46 keeps `.note.GNU-stack` as an output section with
# --emit-relocs, as qld does; GNU ld 2.42 (Ubuntu 24.04) drops it.
diff.ignore = [".note.GNU-stack"]
