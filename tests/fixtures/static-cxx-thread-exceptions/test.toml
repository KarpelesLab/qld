# Exceptions thrown and caught in threads of a static C++ program linked
# without --eh-frame-hdr. The unwinder then walks .eh_frame from
# __EH_FRAME_BEGIN__ (registered by crtbeginT.o) up to a zero terminator, so
# the output .eh_frame must have no alignment padding between input sections.
description = "static C++: exceptions in threads, no .eh_frame_hdr"
compile = ["c++ -O2 -c main.cpp"]
driver = "c++"
link = "-static -pthread -o out main.o"
run = "./out"
expect.stdout = """
caught three
table 3 counter 5
"""
expect.readelf = [".eh_frame", "!.eh_frame_hdr", "TLS "]
determinism = true
