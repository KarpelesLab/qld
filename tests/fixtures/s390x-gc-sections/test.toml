# M4: --gc-sections on s390x. Liveness follows the `larl` and GOT
# relocations of big-endian code, so the referenced function and data stay
# and the rest goes.
description = "--gc-sections removes dead functions and data, for s390x"
compile = ["cc -O2 -ffunction-sections -fdata-sections -fPIE -c main.c"]
driver = "cc"
link = "-pie -o out main.o -Wl,--gc-sections"
run = "./out"
expect.stdout = "42\n"
expect.readelf = [
  "IBM S/390",
  "live_function_qld",
  "live_data_qld",
  "!dead_function_qld",
  "!dead_data_qld",
]
targets = ["s390x-linux-gnu"]
determinism = true
