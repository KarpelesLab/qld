# M1: the first program qld must link. Static glibc, no dynamic sections.
description = "static hello world in C"
compile = ["cc -O2 -c hello.c"]
driver = "cc"
link = "-static -o hello hello.o"
run = "./hello"
expect.stdout = "hello, world\n"
expect.readelf = [
  "EXEC (Executable file)",
  "GNU_STACK",
  "!INTERP",
  "!.dynamic",
]
expect.readelf_arch.x86_64 = ["!R_X86_64_JUMP_SLOT"]
expect.readelf_arch.aarch64 = ["!R_AARCH64_JUMP_SLOT"]
determinism = true
