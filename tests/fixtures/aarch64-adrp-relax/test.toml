# M4: the ADRP relaxations (lld's; GNU ld has none). GOT loads of
# variables the program defines become ADRP+ADD, and ADRP+ADD becomes
# NOP+ADR within 1 MiB. The same objects are linked relaxed (the default)
# and with --no-relax as PIEs, and statically, where static glibc adds about
# two thousand relaxed pairs. Only the static program runs: under qemu the
# fixture runner can start one program, not a `&&` chain.
description = "AArch64 ADRP+LDR and ADRP+ADD relaxations, against --no-relax"
compile = ["cc -O2 -fPIC -c main.c", "cc -O2 -fPIC -c data.c"]
driver = "cc"
link = [
  "-pie -o out-norelax main.o data.o -Wl,--no-relax",
  "-pie -o out main.o data.o",
  "-static -o out-static main.o data.o",
]
run = "./out-static"
expect.stdout = "sum 33 same\n"
expect.readelf = [
  "AArch64",
  "EXEC (Executable file)",
]
expect.readelf_files."out" = [
  "DYN (",
]
targets = ["aarch64-linux-gnu"]
determinism = true
