# M4: an IFUNC in a static executable. The stub in `.plt` jumps through a
# `.got.plt` slot that an IRELATIVE relocation fills at startup, and the
# function pointer must be the stub's address, so the two calls agree.
description = "IFUNC resolved at startup in a static executable, for AArch64"
compile = ["cc -O2 -c ifunc.c"]
driver = "cc"
link = "-static -o out ifunc.o"
run = "./out"
expect.stdout = "pick 2 2 same\n"
expect.readelf = [
  "AArch64",
  "R_AARCH64_IRELATIVE",
  "!R_AARCH64_JUMP_SLOT",
]
targets = ["aarch64-linux-gnu"]
determinism = true
