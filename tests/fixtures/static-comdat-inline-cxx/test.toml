# COMDAT groups: inline functions, their static locals, template
# instantiations and vtables emitted in several objects must be deduplicated
# to a single copy, so both objects share one `counter()` state.
# Static variant of the `comdat-inline-cxx` fixture: the same program linked with
# -static, so it runs through the M1 static pipeline instead of the
# default (PIE, dynamic) one.
description = "C++ COMDAT deduplication of inline functions, templates, vtables (static)"
compile = ["c++ -O0 -c a.cpp", "c++ -O0 -c b.cpp", "c++ -O0 -c main.cpp"]
driver = "c++"
link = "-static -o out main.o a.o b.o"
run = "./out"
expect.stdout = """
from_a=15 from_b=31
counter=2
same counter: yes
same vtable: yes
same template: yes
"""
determinism = true
