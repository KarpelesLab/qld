# --wrap=SYMBOL: undefined references to SYMBOL resolve to __wrap_SYMBOL, and
# references to __real_SYMBOL resolve to SYMBOL. Works for a local function
# (compute) and a libc function (malloc); libc's own internal calls are not
# affected, and neither are references from the defining object.
description = "--wrap for a local function and for malloc"
compile = ["cc -O2 -fno-builtin -c main.c", "cc -O2 -c wrap.c", "cc -O2 -c compute.c"]
driver = "cc"
link = "-o out main.o wrap.o compute.o -Wl,--wrap=compute -Wl,--wrap=malloc"
run = "./out"
expect.stdout = """
wrapped compute(4)
compute(4) = 41
direct from defining object = 40
wrapped malloc calls: 2
"""
