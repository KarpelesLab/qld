# M4: a dynamic PIE against glibc, for 32-bit Arm. Covers the PLT header
# and its 12-byte entries, `.got.plt` slots that point back at the header
# for lazy binding, `SHT_REL` dynamic relocations (`DT_REL`, `DT_RELSZ`,
# `DT_PLTREL = DT_REL`), Thumb code calling the A32 PLT with `blx`, and the
# 64 KiB maximum page size.
description = "dynamic PIE hello world in C, for 32-bit Arm"
compile = ["cc -O2 -fPIE -c hello.c"]
driver = "cc"
link = "-pie -o hello hello.o"
run = "./hello"
expect.stdout = "hello, dynamic world (20)\n"
expect.readelf = [
  "ELF32",
  "ARM",
  "DYN (",
  "INTERP",
  "ld-linux-armhf.so.3",
  "EXIDX",
  "R_ARM_JUMP_SLOT",
  "R_ARM_RELATIVE",
  "0x10000",
]
targets = ["arm-linux-gnueabihf"]
determinism = true
