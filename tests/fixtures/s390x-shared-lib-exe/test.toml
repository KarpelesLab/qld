# M4: a shared library and an executable linked against it, on s390x.
# Covers lazy PLT calls in both directions (the library calls back into the
# executable), the library's data reached through its GOT, and a TLS
# variable of the library: general-dynamic in the library (a GOT pair and
# `__tls_get_offset` at run time), relaxed to initial-exec in the
# executable, which then needs an `R_390_TLS_TPOFF` GOT entry.
description = "s390x shared library plus executable, with a callback and library TLS"
compile = ["cc -O2 -fPIC -c greet.c", "cc -O2 -fPIE -c main.c"]
driver = "cc"
link = [
  "-shared -Wl,-soname,libgreet.so -o libgreet.so greet.o",
  "-o out main.o -L. -lgreet -Wl,-rpath,$ORIGIN -rdynamic",
]
run = "./out"
expect.stdout = """
hello from libgreet (tls=5)
callback: 10
greet_calls=1 lib_tls=5
"""
expect.readelf = [
  "IBM S/390",
  "Shared library: [libgreet.so]",
  "$ORIGIN",
  "exe_callback_qld",
  "R_390_JMP_SLOT",
  "R_390_TLS_TPOFF",
]
expect.readelf_files."libgreet.so" = [
  "DYN (",
  "Library soname: [libgreet.so]",
  "R_390_TLS_DTPMOD",
  "greet_calls_qld",
]
targets = ["s390x-linux-gnu"]
determinism = true
