# M4: --gc-sections on AArch64. The relocation scan walks `adrp`/`add`
# pairs and `bl` targets to find what is live, so the same sweep must keep
# the referenced function and data and drop the rest.
description = "--gc-sections removes dead functions and data, for AArch64"
compile = ["cc -O2 -ffunction-sections -fdata-sections -fPIE -c main.c"]
driver = "cc"
link = "-pie -o out main.o -Wl,--gc-sections"
run = "./out"
expect.stdout = "42\n"
expect.readelf = [
  "AArch64",
  "live_function_qld",
  "live_data_qld",
  "!dead_function_qld",
  "!dead_data_qld",
]
targets = ["aarch64-linux-gnu"]
determinism = true
