# Common symbols (-fcommon): tentative definitions of the same name in several
# objects merge into one, with the largest size and alignment.
# Static variant of the `common-symbols` fixture: the same program linked with
# -static, so it runs through the M1 static pipeline instead of the
# default (PIE, dynamic) one.
description = "common symbols merge to the largest definition (static)"
compile = [
  "cc -O2 -fcommon -c a.c",
  "cc -O2 -fcommon -c b.c",
  "cc -O2 -fcommon -c main.c",
]
driver = "cc"
link = "-static -o out a.o b.o main.o"
run = "./out"
expect.stdout = """
shared_counter=5
big_common[63]=x
same object: yes
"""
expect.readelf = [
  "   64 OBJECT  GLOBAL DEFAULT",
  "big_common",
  "shared_counter",
]
