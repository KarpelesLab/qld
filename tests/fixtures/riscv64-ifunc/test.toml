# M4: an IFUNC in a static RISC-V executable. The stub jumps through a
# `.got.plt` slot that an IRELATIVE relocation fills at startup, and the
# function pointer must be the stub's address, so the two calls agree.
description = "IFUNC resolved at startup in a static executable, for RISC-V 64"
compile = ["cc -O2 -c ifunc.c"]
driver = "cc"
link = "-static -o out ifunc.o"
run = "./out"
expect.stdout = "pick 2 2 same\n"
expect.readelf = [
  "RISC-V",
  "R_RISCV_IRELATIVE",
  "!R_RISCV_JUMP_SLOT",
]
targets = ["riscv64-linux-gnu"]
determinism = true
