# M4: the four TLS models in an executable, once with GCC's TLS descriptors
# and once with the traditional `__tls_get_addr` sequences. Everything is in
# the executable, so all of it relaxes to local-exec: no TLS dynamic
# relocation and no GOT entry may be left, and `__tls_get_addr` must not be
# called, so it gets no PLT slot (no relocation names it).
#
# The objects are built with -fPIC: with -fPIE, GCC 14 and later already
# emit local-exec for variables of the executable, whatever the
# `tls_model` attribute says, and there would be nothing to relax. The
# undefined `__tls_get_addr` stays in `.dynsym`, as with GNU ld: the object
# refers to it, even though every call was relaxed away.
description = "AArch64 TLS: general-dynamic, local-dynamic, initial-exec and local-exec relaxed to local-exec"
compile = [
  "cc -O2 -fPIC -mtls-dialect=desc -c tls.c -o tls-desc.o",
  "cc -O2 -fPIC -mtls-dialect=trad -c tls.c -o tls-trad.o",
]
driver = "cc"
link = [
  "-pie -o out-desc tls-desc.o",
  "-pie -o out-trad tls-trad.o",
]
output = "out-desc"
run = "./out-desc && ./out-trad"
expect.stdout = "tls 31\ntls 31\n"
expect.readelf = [
  "AArch64",
  "TLS",
  "!R_AARCH64_TLSDESC",
  "!R_AARCH64_TLS_DTPMOD64",
  "!R_AARCH64_TLS_TPREL64",
  "!__tls_get_addr",
]
expect.readelf_files."out-trad" = [
  "TLS",
  "!R_AARCH64_TLS_DTPMOD64",
  "!R_AARCH64_TLS_TPREL64",
  "!__tls_get_addr@GLIBC_2.17 + 0",
]
targets = ["aarch64-linux-gnu"]
determinism = true
# GNU ld 2.42 (Ubuntu 24.04) does not relax the traditional general-dynamic
# sequences to local-exec in an executable; 2.45 relaxes them as qld does
# but still gives `__tls_get_addr` a PLT slot that nothing calls.
gnu_ld_min_version = "2.46"
