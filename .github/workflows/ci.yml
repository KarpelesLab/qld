name: CI

on:
  push:
    branches: [master]
  pull_request:

# One CI run per ref: a new push cancels the runs it supersedes, so a
# stack of release-plz PR updates does not sit in the queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --no-fail-fast
      - run: cargo build --release

  fixtures-gnu-ld:
    name: fixtures validated against GNU ld
    runs-on: ubuntu-latest
    env:
      QLD_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ binutils libc6-dev libstdc++-13-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-14-loongarch64-linux-gnu g++-14-loongarch64-linux-gnu \
            binutils-loongarch64-linux-gnu libc6-dev-loong64-cross \
            gcc-powerpc64le-linux-gnu g++-powerpc64le-linux-gnu \
            binutils-powerpc64le-linux-gnu \
            gcc-powerpc64-linux-gnu g++-powerpc64-linux-gnu binutils-powerpc64-linux-gnu \
            gcc-riscv64-linux-gnu g++-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            gcc-s390x-linux-gnu g++-s390x-linux-gnu binutils-s390x-linux-gnu \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf \
            gcc-i686-linux-gnu g++-i686-linux-gnu binutils-i686-linux-gnu \
            qemu-user-static
          # noble ships only the versioned LoongArch compiler names
          sudo ln -sf /usr/bin/loongarch64-linux-gnu-gcc-14 /usr/local/bin/loongarch64-linux-gnu-gcc
          sudo ln -sf /usr/bin/loongarch64-linux-gnu-g++-14 /usr/local/bin/loongarch64-linux-gnu-g++
      - run: cargo test --all-features --test fixtures -- --ignored --nocapture
      # target inference from GCC LTO objects and LLVM bitcode (LLVMgold.so)
      - run: sudo apt-get install -y clang llvm-18-linker-tools
      - run: cargo test --all-features --test elf_target -- --nocapture

  i386:
    name: i386 links compared with GNU ld
    # heavy cross-architecture job: master pushes only
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      QLD_REQUIRE_I386_TOOLS: "1"
      QLD_REQUIRE_I386_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - run: cargo test --all-features --test i386 -- --nocapture

  corruption:
    name: randomized corruption of every fixture
    # heavy cross-architecture job: master pushes only
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # the in-tree default already runs inside the `test` job; this is the
      # long pass
      QLD_CORRUPT_ITERS: "4000"
      QLD_CORRUPT_SEEDS: "101,202,303,404,505,606,707,808"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --all-features --test corrupt -- --test-threads=2 --nocapture

  diagnostics:
    name: diagnostics compared with GNU ld and lld
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc binutils libc6-dev
      - run: cargo test --all-features --test diag -- --test-threads=2 --nocapture

  relocatable:
    name: -r and --emit-relocs on every ELF class, compared with lld
    # heavy cross-architecture job: master pushes only
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      QLD_REQUIRE_TOOLS: "1"
      QLD_TEST_LLD: ld.lld-22
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # one clang builds every architecture's objects (the test sources
      # include no header, so no cross sysroot is needed); lld is the oracle,
      # and gcc-multilib lets the i386 combined object be linked and run
      - run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y clang-22 lld-22 llvm-22 gcc-multilib g++-multilib
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - run: cargo test --all-features --test relocatable -- --test-threads=2 --nocapture

  debug-indexes:
    name: Debug indexes and section ordering compared with lld
    # heavy cross-architecture job: master pushes only
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      QLD_REQUIRE_TOOLS: "1"
      QLD_TEST_LLD: ld.lld-22
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the .gdb_index and .debug_names comparisons assume LLVM 22 or 23
      - run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y clang-22 lld-22 llvm-22 gdb
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - run: cargo test --all-features --test ordering --test debug_index -- --test-threads=2

  x32:
    name: x32 links compared with GNU ld
    # heavy cross-architecture job: master pushes only
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      QLD_REQUIRE_X32_TOOLS: "1"
      QLD_REQUIRE_X32_LIBC: "1"
      QLD_REQUIRE_X32_CXX: "1"
      QLD_REQUIRE_X32_LLD: "1"
      QLD_LLD: ld.lld-22
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # gcc-multilib brings libc6-dev-x32 and libx32gcc-13-dev; g++-multilib
      # brings libx32stdc++-13-dev
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y lld-22
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      # x32 programs run only on a kernel built with CONFIG_X86_X32_ABI
      - name: Can this kernel run x32 binaries?
        run: |
          printf 'void _start(void){__asm__ volatile("syscall"::"a"(0x4000003c),"D"(0));}\n' > /tmp/x32.c
          gcc -mx32 -O2 -ffreestanding -nostdlib -static /tmp/x32.c -o /tmp/x32
          if /tmp/x32; then
            echo "QLD_REQUIRE_X32_RUN=1" >> "$GITHUB_ENV"
          else
            echo "x32 binaries do not run on this kernel; links are compared, not run"
          fi
      - run: cargo test --all-features --test x32 -- --nocapture

  arm32:
    name: 32-bit Arm links compared with lld
    # heavy cross-architecture job: master pushes only
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      QLD_REQUIRE_ARM_TOOLS: "1"
      QLD_REQUIRE_ARM_GNU_TOOLS: "1"
      QLD_LLD: ld.lld-22
      QLD_ARM_CC: clang-22
      QLD_LLVM_OBJDUMP: llvm-objdump-22
      QLD_LLVM_READELF: llvm-readelf-22
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # noble's LLVM 18 predates the lld thunk and .ARM.exidx behavior the
      # comparisons were made against
      - run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y lld-22 llvm-22
      # the GNU assembler writes the group relocations clang's cannot, and
      # GNU ld is their oracle: lld does not link them
      - run: sudo apt-get install -y binutils-arm-linux-gnueabihf
      - run: cargo test --all-features --test arm32 -- --nocapture

  arm32-fixtures:
    name: 32-bit Arm fixtures run under qemu
    # heavy cross-architecture job: master pushes only
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      QLD_REQUIRE_TOOLS: "1"
      QLD_FIXTURE: arm-
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf qemu-user-static
      # linked by qld, run under qemu-arm
      - run: cargo test --all-features --test fixtures -- --nocapture

  ppc64be:
    name: PowerPC64 BE (ELFv1) links compared with GNU ld
    # heavy cross-architecture job: master pushes only
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      QLD_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GNU ld is the reference: lld has no ELFv1 support
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-powerpc64-linux-gnu g++-powerpc64-linux-gnu \
            binutils-powerpc64-linux-gnu qemu-user-static
      - run: cargo test --all-features --test ppc64be -- --nocapture
      # the ppc64-* fixtures, linked with qld and run under qemu-ppc64
      - run: cargo test --all-features --test fixtures -- --nocapture
        env:
          QLD_FIXTURE: ppc64-

  s390x:
    name: s390x links compared with GNU ld
    # heavy cross-architecture job: master pushes only
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      QLD_REQUIRE_S390X_TOOLS: "1"
      QLD_REQUIRE_S390X_RUN: "1"
      QLD_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu g++-s390x-linux-gnu \
            binutils-s390x-linux-gnu qemu-user-static
      - run: cargo test --all-features --test s390x -- --nocapture
      # the s390x fixtures, linked with qld and run under qemu-s390x
      - run: cargo test --all-features --test fixtures -- --nocapture
        env:
          QLD_FIXTURE: s390x

  riscv32:
    name: RISC-V 32 links compared with lld
    # heavy cross-architecture job: master pushes only
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      QLD_REQUIRE_RISCV_TOOLS: "1"
      QLD_REQUIRE_RISCV32_QEMU: "1"
      QLD_LLD: ld.lld-22
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y lld-22 qemu-user-static
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - run: cargo test --all-features --test riscv32 -- --nocapture

  riscv64:
    name: RISC-V 64 links compared with lld
    # heavy cross-architecture job: master pushes only
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      QLD_REQUIRE_RISCV_TOOLS: "1"
      # tests/riscv64.rs reads QLD_LLD, not QLD_TEST_LLD
      QLD_LLD: ld.lld-22
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # noble's LLVM 18 predates the lld relaxation behavior the tests compare with
      - run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y lld-22
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - run: cargo test --all-features --test riscv64 -- --nocapture

  ppc64le:
    name: PowerPC64 LE links compared with lld
    # heavy cross-architecture job: master pushes only
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      QLD_REQUIRE_TOOLS: "1"
      QLD_TEST_LLD: ld.lld-22
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the comparisons were made against lld 23; noble's lld 18 differs
      - run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y lld-22
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - run: cargo test --all-features --test ppc64 -- --nocapture

  loongarch64:
    name: LoongArch64 links compared with lld
    # heavy cross-architecture job: master pushes only
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      QLD_REQUIRE_LOONGARCH: "1"
      QLD_TEST_LOONGARCH_CC: clang-22
      QLD_TEST_LLD: ld.lld-22
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # noble's LLVM 18 predates lld's LoongArch TLSDESC and relaxation
      - run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y lld-22
      - run: cargo test --all-features --test loongarch -- --nocapture

  arm64-linux:
    name: AArch64 fixtures on arm64
    runs-on: ubuntu-24.04-arm
    env:
      # The arm64 runner has 4 cores and 16 GiB, and the ELF pipeline is
      # monomorphized over four class/byte-order combinations, so a default
      # `cargo test` build was killed (exit 143) while compiling. Fewer
      # parallel rustc processes and no debug info in the test profile keep
      # it inside the runner.
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc g++ binutils libc6-dev libstdc++-13-dev
      # On this runner aarch64-linux-gnu is the host, so the aarch64-* fixtures
      # compile, link, run and are checked natively, and tests/aarch64.rs
      # compares against the native GNU ld. Fixtures for other targets skip:
      # there is no x86-64 cross compiler here, so QLD_REQUIRE_TOOLS is set
      # only for the aarch64 ones, which must not skip.
      - run: cargo test --all-features --no-fail-fast
      - run: cargo test --all-features --test fixtures
        env:
          QLD_REQUIRE_TOOLS: "1"
          QLD_FIXTURE: aarch64

  macho-macos:
    name: Mach-O links run on macOS
    runs-on: macos-latest
    env:
      QLD_REQUIRE_MACHO_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # the Rust test also links an x86_64 binary and runs it under Rosetta
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # x86_64 slices of the fixtures run under Rosetta on the arm64 runner.
      - run: softwareupdate --install-rosetta --agree-to-license || true
      - run: cargo test --all-features --test macho_link -- --nocapture
      - run: cargo test --all-features --test macho_lto -- --nocapture
      - name: Real projects with -fuse-ld=qld (zlib, Lua, SQLite, {fmt})
        if: success() || failure()
        run: |
          cargo build --release
          tests/projects/macos-suite.sh target/release/qld "$RUNNER_TEMP/macos-suite"
      - name: Keep the suite's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-suite-logs
          path: |
            ${{ runner.temp }}/macos-suite/build/*/*.log
            ${{ runner.temp }}/macos-suite/links.log

  pe-windows:
    name: PE images run on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
            mingw-w64-i686-gcc mingw-w64-i686-binutils
          path-type: inherit
      # cargo runs as a Windows process, so MSYS2's compilers must be on the
      # Windows PATH. They are named `gcc`, not `x86_64-w64-mingw32-gcc`,
      # which the tests probe for with -dumpmachine.
      # Each GITHUB_PATH line is prepended, so the last one wins: mingw64
      # goes last so that unprefixed tools (nm, windres) are the x86-64 ones.
      - name: Put the MinGW toolchains on PATH
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\mingw32\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check the toolchain is visible
        shell: pwsh
        run: |
          gcc -dumpmachine
          foreach ($tool in "gcc", "g++", "nm", "windres", "ar", "objdump",
                            "i686-w64-mingw32-gcc", "i686-w64-mingw32-ld") {
            $found = (Get-Command $tool -ErrorAction SilentlyContinue).Source
            Write-Host "$tool -> $(if ($found) { $found } else { 'NOT FOUND' })"
          }
      - name: Link the PE fixtures with qld
        run: cargo test --all-features --test coff_link
        env:
          QLD_REQUIRE_COFF_TOOLS: "1"
      - name: Run the images qld produced
        shell: pwsh
        run: |
          $root = "target/tmp/coff-link"
          $cases = @(
            @{ exe = "$root/console-hello-world/qld.exe";        expect = "hello from qld" },
            @{ exe = "$root/dll-with-import-library/client.exe";  expect = "hello from the dll" },
            @{ exe = "$root/cxx-exceptions/qld.exe";              expect = "caught boom" },
            @{ exe = "$root/thread-local-storage/qld.exe";        expect = "8" },
            @{ exe = "$root/auto-import/auto.exe";                expect = "hello from the dll" },
            @{ exe = "$root/i386-hello/qld.exe";                  expect = "hello from qld" },
            @{ exe = "$root/i386-dll/client.exe";                 expect = "7 10 5 3 99" },
            @{ exe = "$root/i386-tls/qld.exe";                    expect = "8" },
            @{ exe = "$root/i386-cxx/qld.exe";                    expect = "caught boom" },
            @{ exe = "$root/i386-safeseh/registered.exe";         code = 42 },
            @{ exe = "$root/i386-safeseh/registered-win6.exe";    code = 42 },
            # the handler table does not list this handler, so Windows must
            # refuse to run it and the process dies
            @{ exe = "$root/i386-safeseh/unregistered.exe";       crash = $true }
          )
          $failed = 0
          foreach ($case in $cases) {
            if (-not (Test-Path $case.exe)) {
              Write-Host "MISSING $($case.exe)"; $failed = 1; continue
            }
            Push-Location (Split-Path $case.exe)
            $out = & (".\" + (Split-Path $case.exe -Leaf)) 2>&1 | Out-String
            $code = $LASTEXITCODE
            Pop-Location
            $want = if ($case.ContainsKey("code")) { $case.code } else { 0 }
            $ok = if ($case.crash) { $code -ne 0 -and $code -ne 42 }
                  else { $code -eq $want -and (-not $case.expect -or $out -match [regex]::Escape($case.expect)) }
            if ($ok) {
              Write-Host "PASS $($case.exe)"
            } else {
              Write-Host "FAIL $($case.exe): exit $code, output: $out"; $failed = 1
            }
          }
          exit $failed

  pe-windows-arm64:
    name: ARM64 PE images run on Windows on ARM
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Link the ARM64 fixtures with qld
        run: cargo test --all-features --test coff_link_arm64
      - name: Run the images qld produced
        shell: pwsh
        run: |
          $failed = 0
          foreach ($exe in "target/tmp/coff-link/arm64-program/qld.exe", "target/tmp/coff-link/arm64-dll/client.exe") {
            if (-not (Test-Path $exe)) { Write-Host "MISSING $exe"; $failed = 1; continue }
            Push-Location (Split-Path $exe)
            $out = & (".\" + (Split-Path $exe -Leaf)) 2>&1 | Out-String
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0 -or -not ($out -match "hello from qld arm64") -or -not ($out -match "42 7 5 9 42")) {
              Write-Host "FAIL ${exe}: exit $code, output: $out"; $failed = 1
            } else {
              Write-Host "PASS $exe"
            }
          }
          exit $failed

  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
